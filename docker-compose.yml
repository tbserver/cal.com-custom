services:
  calcom:
    build: .
    container_name: calcom
    environment:
      - DOPPLER_TOKEN=${DOPPLER_TOKEN}
      - TZ=Europe/Paris
    depends_on:
      calcom_db:
        condition: service_healthy
    networks:
      - traefik_default
      - tunnel_net
      - calcom_internal
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_default"
      - "traefik.http.routers.calcom.rule=Host(`rdv.datapinpin.fr`)"
      - "traefik.http.routers.calcom.entrypoints=websecure"
      - "traefik.http.routers.calcom.tls=true"
      - "traefik.http.routers.calcom.tls.certresolver=myresolver"
      - "traefik.http.services.calcom.loadbalancer.server.port=3000"
    volumes:
      - ./custom.css:/app/apps/web/public/custom.css:ro
    restart: unless-stopped

  calcom_db:
    image: postgres:16-alpine
    container_name: calcom_db
    environment:
      - POSTGRES_USER=calcom
      - POSTGRES_PASSWORD=${CALCOM_POSTGRES_PASSWORD:-calcompass}
      - POSTGRES_DB=calcom
      - TZ=Europe/Paris
    volumes:
      - /mnt/raid0/tbserver/volumes/calcom_postgres:/var/lib/postgresql/data
    networks:
      - calcom_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U calcom -d calcom"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

networks:
  traefik_default:
    external: true
  tunnel_net:
    external: true
  calcom_internal:
    driver: bridge
